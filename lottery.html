<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 運試し抽選会 🎰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #764ba2;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .lottery-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            position: relative;
            overflow: hidden;
        }

        .lottery-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .lottery-button:active {
            transform: translateY(0);
        }

        .lottery-button.spinning {
            animation: spin 0.5s ease-in-out;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes spin {
            0% { transform: rotateY(0); }
            100% { transform: rotateY(360deg); }
        }

        .result {
            margin-top: 40px;
            font-size: 3em;
            font-weight: bold;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease;
        }

        .result.show {
            opacity: 1;
            transform: scale(1);
        }

        .result.win {
            color: #4CAF50;
            animation: winAnimation 1s ease-in-out;
        }

        .result.lose {
            color: #f44336;
            animation: loseAnimation 1s ease-in-out;
        }

        @keyframes winAnimation {
            0% { transform: scale(0) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        @keyframes loseAnimation {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            60% { transform: scale(1.1) translateX(-10px); }
            70% { transform: scale(1.1) translateX(10px); }
            80% { transform: scale(1.1) translateX(-10px); }
            90% { transform: scale(1.1) translateX(10px); }
            100% { transform: scale(1) translateX(0); }
        }

        .message {
            margin-top: 20px;
            font-size: 1.2em;
            color: #666;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .message.show {
            opacity: 1;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .firework {
            position: fixed;
            width: 4px;
            height: 4px;
            background: gold;
            border-radius: 50%;
            position: absolute;
            animation: firework-explode 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes firework-explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }

        .reset-button {
            margin-top: 30px;
            background: #9e9e9e;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            display: none;
        }

        .reset-button.show {
            opacity: 1;
            display: inline-block;
        }

        .reset-button:hover {
            background: #757575;
            transform: translateY(-2px);
        }

        .probability-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 10px;
        }

        .slot-machine {
            display: none;
            margin: 30px auto;
            background: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .slot-machine.show {
            display: block;
        }

        .slots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .slot {
            width: 80px;
            height: 80px;
            background: white;
            border: 3px solid gold;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            overflow: hidden;
        }

        .slot.spinning {
            animation: slotSpin 0.1s linear infinite;
        }

        @keyframes slotSpin {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 運試し抽選会 🎰</h1>
        
        <button class="lottery-button" onclick="startLottery()">
            抽選する！
        </button>
        
        <div class="slot-machine" id="slotMachine">
            <div class="slots">
                <div class="slot" id="slot1">?</div>
                <div class="slot" id="slot2">?</div>
                <div class="slot" id="slot3">?</div>
            </div>
        </div>
        
        <div class="result" id="result"></div>
        <div class="message" id="message"></div>
        
        <button class="reset-button" id="resetButton" onclick="resetLottery()">
            もう一度挑戦する
        </button>
    </div>
    
    <div class="probability-info">
        当選確率: 30%
    </div>

    <script>
        const winProbability = 0.3; // 30% win rate
        const symbols = ['🍒', '🍋', '🍊', '🍇', '⭐', '💎', '7️⃣'];
        const winSymbol = '7️⃣';
        
        function startLottery() {
            const button = document.querySelector('.lottery-button');
            const result = document.getElementById('result');
            const message = document.getElementById('message');
            const resetButton = document.getElementById('resetButton');
            const slotMachine = document.getElementById('slotMachine');
            
            // Reset previous results
            result.className = 'result';
            message.className = 'message';
            result.textContent = '';
            message.textContent = '';
            
            // Disable button and add spinning animation
            button.classList.add('spinning');
            button.disabled = true;
            button.textContent = '抽選中...';
            
            // Show slot machine
            slotMachine.classList.add('show');
            
            // Start slot animation
            const slots = document.querySelectorAll('.slot');
            slots.forEach(slot => {
                slot.classList.add('spinning');
            });
            
            // Spin slots with random symbols
            let spinInterval = setInterval(() => {
                slots.forEach(slot => {
                    slot.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                });
            }, 100);
            
            // Determine win or lose
            const isWin = Math.random() < winProbability;
            
            // Stop spinning after 2 seconds
            setTimeout(() => {
                clearInterval(spinInterval);
                
                // Stop slot animation one by one
                const finalSymbols = isWin ? 
                    [winSymbol, winSymbol, winSymbol] : 
                    [
                        symbols[Math.floor(Math.random() * (symbols.length - 1))],
                        symbols[Math.floor(Math.random() * (symbols.length - 1))],
                        symbols[Math.floor(Math.random() * (symbols.length - 1))]
                    ];
                
                // Stop each slot with delay
                slots.forEach((slot, index) => {
                    setTimeout(() => {
                        slot.classList.remove('spinning');
                        slot.textContent = finalSymbols[index];
                        
                        // Show result after last slot stops
                        if (index === slots.length - 1) {
                            setTimeout(() => {
                                showResult(isWin);
                            }, 500);
                        }
                    }, index * 300);
                });
                
                // Re-enable button
                button.classList.remove('spinning');
                button.disabled = false;
                button.textContent = '抽選する！';
            }, 2000);
        }
        
        function showResult(isWin) {
            const result = document.getElementById('result');
            const message = document.getElementById('message');
            const resetButton = document.getElementById('resetButton');
            
            if (isWin) {
                result.textContent = '🎉 大当たり！ 🎉';
                result.className = 'result show win';
                message.textContent = 'おめでとうございます！素晴らしい運の持ち主です！';
                
                // Create confetti effect
                createConfetti();
                
                // Create fireworks
                setTimeout(createFireworks, 500);
            } else {
                result.textContent = '😢 残念... 😢';
                result.className = 'result show lose';
                message.textContent = '今回は外れでした。もう一度チャレンジしてみましょう！';
            }
            
            message.className = 'message show';
            resetButton.className = 'reset-button show';
        }
        
        function createConfetti() {
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', 
                          '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50',
                          '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, Math.random() * 1000);
            }
        }
        
        function createFireworks() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < 50; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                
                const angle = (Math.PI * 2 * i) / 50;
                const velocity = 100 + Math.random() * 200;
                const x = Math.cos(angle) * velocity;
                const y = Math.sin(angle) * velocity;
                
                firework.style.setProperty('--x', `${x}px`);
                firework.style.setProperty('--y', `${y}px`);
                firework.style.left = centerX + 'px';
                firework.style.top = centerY + 'px';
                
                document.body.appendChild(firework);
                
                setTimeout(() => firework.remove(), 1000);
            }
        }
        
        function resetLottery() {
            const result = document.getElementById('result');
            const message = document.getElementById('message');
            const resetButton = document.getElementById('resetButton');
            const slotMachine = document.getElementById('slotMachine');
            const slots = document.querySelectorAll('.slot');
            
            result.className = 'result';
            message.className = 'message';
            resetButton.className = 'reset-button';
            slotMachine.classList.remove('show');
            
            result.textContent = '';
            message.textContent = '';
            
            slots.forEach(slot => {
                slot.textContent = '?';
            });
        }
        
        // Add keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                const button = document.querySelector('.lottery-button');
                if (!button.disabled) {
                    startLottery();
                }
            }
        });
    </script>
</body>
</html>
